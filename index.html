<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO -->
    <title>Country Boys Grill | Southern BBQ, Ribs &amp; Soul Food in Durham, NC</title>
    <meta
      name="description"
      content="Country Boys Grill — Southern-style BBQ, chicken, ribs & soul food made with local, farm-raised meats in Durham, NC. Est. 2021. 2900 Holloway Street · 919-243-5138."
    />
    <meta name="theme-color" content="#0B2A4A" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Country Boys Grill" />
    <meta property="og:title" content="Country Boys Grill | Southern BBQ, Ribs & Soul Food in Durham, NC" />
    <meta
      property="og:description"
      content="Good Food. Real Flavor. Southern Roots. Local, farm-raised meats smoked and fried the Southern way in Durham, NC."
    />
    <meta
      property="og:image"
      content="https://images.pexels.com/photos/13203940/pexels-photo-13203940.jpeg?auto=compress&cs=tinysrgb&fit=crop&w=1200&h=630"
    />
    <meta property="og:locale" content="en_US" />

    <!-- Fonts: Alfa Slab One (display) + Poppins (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&display=swap"
      rel="stylesheet"
    />

    <!-- LocalBusiness / Restaurant structured data (hours are placeholders — keep in sync with src/data/site.ts) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Restaurant",
        "name": "Country Boys Grill",
        "alternateName": "CBG",
        "slogan": "Good Food. Real Flavor. Southern Roots.",
        "servesCuisine": ["Southern BBQ", "Southern", "Soul Food"],
        "priceRange": "$$",
        "telephone": "+1-919-243-5138",
        "foundingDate": "2021",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "2900 Holloway Street",
          "addressLocality": "Durham",
          "addressRegion": "NC",
          "postalCode": "27704",
          "addressCountry": "US"
        },
        "openingHoursSpecification": [
          { "@type": "OpeningHoursSpecification", "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday"], "opens": "11:00", "closes": "21:00" },
          { "@type": "OpeningHoursSpecification", "dayOfWeek": ["Friday", "Saturday"], "opens": "11:00", "closes": "22:00" },
          { "@type": "OpeningHoursSpecification", "dayOfWeek": "Sunday", "opens": "12:00", "closes": "20:00" }
        ],
        "image": "https://images.pexels.com/photos/13203940/pexels-photo-13203940.jpeg?auto=compress&cs=tinysrgb&fit=crop&w=1200&h=630",
        "hasMenu": "https://www.countryboysgrill.com/#menu"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
